[Service]
# The root disk must have recovery headroom even on boot or automatic restart.
ExecStartPre=/usr/bin/python3 /usr/local/sbin/ton-notify-disk-guard --check-start
Environment=HEALTH_DIRECTORY=/run/ton-notify-health
RuntimeDirectory=ton-notify-health
RuntimeDirectoryPreserve=yes
RuntimeDirectoryMode=0700
RestartSec=30
# Bound ongoing writes after the disk guard requests a stop.
TimeoutStopSec=20
